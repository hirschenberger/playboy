[vars]
llvm_version = "19"
clang = "clang-{{vars.llvm_version}} --target=riscv32-unknown-elf"
readelf = "llvm-readelf-{{vars.llvm_version}}"
size = "llvm-size-{{vars.llvm_version}}"
objdump = "llvm-objdump-{{vars.llvm_version}}"
gdb = "gdb-multiarch"
openocd_dir = ".tools/openocd-rp2350"
openocd = "{{vars.openocd_dir}}/src/openocd"
openocd_scripts = "{{vars.openocd_dir}}/tcl"

build_dir = "build"
image_name = "playboy"

elf = "{{vars.build_dir}}/{{vars.image_name}}.elf"
uf2 = "{{vars.build_dir}}/{{vars.image_name}}.uf2"
map = "{{vars.build_dir}}/{{vars.image_name}}.map"
disassembly = "{{vars.build_dir}}/{{vars.image_name}}.dis"
openocd_log = "{{vars.build_dir}}/openocd.log"
serial_device = "/dev/ttyACM0"
asm_flags = "-march=rv32imac_zicsr_zifencei_zba_zbb_zbs_zbkb -mabi=ilp32 -fno-pic -I src"

[bootstrap.packages]
"apt:clang-19" = "latest"
"apt:lld-19" = "latest"
"apt:llvm-19" = "latest"
"apt:picotool" = "latest"
"apt:gdb-multiarch" = "latest"
"apt:git" = "latest"
"apt:autoconf" = "latest"
"apt:automake" = "latest"
"apt:libtool" = "latest"
"apt:pkg-config" = "latest"
"apt:libusb-1.0-0-dev" = "latest"
"apt:python3-pil" = "latest"

[tasks.link]
description = "Assemble and link standalone RP2350 RISC-V ELF"
sources = ["src/rp2350-riscv.ld", "src/**/*.S", "src/**/*.h", "src/**/*.inc"]
outputs = ["{{vars.elf}}", "{{vars.map}}"]
run = [
  "mkdir -p {{vars.build_dir}}",
  "{{vars.clang}} -g {{vars.asm_flags}} -I {{vars.build_dir}} -nostdlib -T src/rp2350-riscv.ld -Wl,-Map,{{vars.map}} src/*.S -o {{vars.elf}}",
]

[tasks.uf2]
description = "Package RP2350 RISC-V UF2"
depends = ["link"]
sources = ["{{vars.elf}}"]
outputs = ["{{vars.uf2}}"]
run = "picotool uf2 convert --quiet {{vars.elf}} {{vars.uf2}} --family rp2350-riscv --abs-block"

[tasks.build]
description = "Build standalone RP2350 RISC-V firmware"
depends = ["uf2"]

[tasks.setup-debugger]
description = "Build Raspberry Pi OpenOCD with RP2350 RISC-V support"
outputs = ["{{vars.openocd}}"]
run = """
set -eu
test -x {{vars.openocd}} && exit 0
mkdir -p .tools
if test ! -d {{vars.openocd_dir}}; then
  git clone --depth 1 --recurse-submodules --branch rpi-common https://github.com/raspberrypi/openocd.git {{vars.openocd_dir}}
else
  git -C {{vars.openocd_dir}} submodule update --init jimtcl
fi
cd {{vars.openocd_dir}}
./bootstrap
CC=clang-{{vars.llvm_version}} ./configure --enable-cmsis-dap-v2 --disable-cmsis-dap --enable-internal-jimtcl --disable-werror
make -j$(nproc)
"""

[tasks.flash]
description = "Flash through BOOTSEL when available, otherwise use RISC-V CMSIS-DAP SWD with CM0 fallback"
depends = ["build", "setup-debugger"]
run = """
set -eu
mkdir -p {{vars.build_dir}}
if picotool info >/dev/null 2>&1; then
  echo "Pico detected in BOOTSEL mode; programming the RISC-V UF2 through Boot ROM."
  picotool load {{vars.uf2}}
  picotool reboot --application --cpu riscv
  exit 0
fi
{{vars.openocd}} -s {{vars.openocd_scripts}} -f interface/cmsis-dap.cfg -c 'adapter speed 1000' -f target/rp2350-riscv.cfg > {{vars.openocd_log}} 2>&1 &
openocd_pid=$!
trap 'kill "$openocd_pid" 2>/dev/null || true; wait "$openocd_pid" 2>/dev/null || true' EXIT
sleep 1
if grep -Fq '[rp2350.rv0] unavailable' {{vars.openocd_log}} || grep -F '[rp2350.rv0]' {{vars.openocd_log}} | grep -Eq 'Examination failed|failed to halt|Failed to read|Target not examined'; then
  echo "RISC-V core 0 examination failed. Attempting rescue reset and CM0 fallback..." >&2
  kill "$openocd_pid" 2>/dev/null || true
  wait "$openocd_pid" 2>/dev/null || true
  timeout 10 {{vars.openocd}} -s {{vars.openocd_scripts}} -f interface/cmsis-dap.cfg -c 'adapter speed 1000' -c 'set RESCUE 1' -f target/rp2350-riscv.cfg > /dev/null 2>&1 || true
  {{vars.openocd}} -s {{vars.openocd_scripts}} -f interface/cmsis-dap.cfg -c 'adapter speed 1000' -c 'set USE_CORE { cm0 rv0 rv1 }' -f target/rp2350.cfg > {{vars.openocd_log}} 2>&1 &
  openocd_pid=$!
  sleep 2
  set +e
  cm0_output=$({{vars.gdb}} --batch --quiet --nx \
    -ex 'set architecture arm' \
    -ex 'target remote :3333' \
    -ex 'monitor halt' \
    -ex 'load {{vars.elf}}' \
    -ex 'monitor reset run' 2>&1)
  cm0_status=$?
  set -e
  printf '%s\n' "$cm0_output"
  if ! printf '%s\n' "$cm0_output" | grep -Fq 'Loading section .text'; then
    echo "CM0 fallback flash failed." >&2
    exit 1
  fi
  kill "$openocd_pid" 2>/dev/null || true
  wait "$openocd_pid" 2>/dev/null || true
  echo "Firmware flashed through CM0. Verifying through RISC-V SWD..." >&2
  {{vars.openocd}} -s {{vars.openocd_scripts}} -f interface/cmsis-dap.cfg -c 'adapter speed 1000' -f target/rp2350-riscv.cfg > {{vars.openocd_log}} 2>&1 &
  openocd_pid=$!
  sleep 2
  if grep -Fq '[rp2350.rv0] unavailable' {{vars.openocd_log}} || grep -F '[rp2350.rv0]' {{vars.openocd_log}} | grep -Eq 'Examination failed|failed to halt|Failed to read|Target not examined'; then
    echo "RISC-V core 0 could not be examined over SWD after CM0 fallback. Hold BOOTSEL while connecting the Pico, then rerun mise run flash." >&2
    exit 1
  fi
fi
set +e
gdb_output=$({{vars.gdb}} --batch --quiet --nx {{vars.elf}} \
  -ex 'set architecture riscv:rv32' \
  -ex 'target remote :3333' \
  -ex 'monitor halt' \
  -ex 'load' \
  -ex 'compare-sections' \
  -ex 'monitor reset run' 2>&1)
gdb_status=$?
set -e
printf '%s\n' "$gdb_output"
if grep -F '[rp2350.rv0]' {{vars.openocd_log}} | grep -Eq 'Examination failed|failed to halt|Failed to read|Target not examined'; then
  echo "RISC-V core 0 could not be examined over SWD. Hold BOOTSEL while connecting the Pico, then rerun mise run flash." >&2
  exit 1
fi
if grep -Fq "attempted 'gdb' connection rejected" {{vars.openocd_log}}; then
  echo "RISC-V core 0 could not be examined over SWD. Hold BOOTSEL while connecting the Pico, then rerun mise run flash." >&2
  exit 1
fi
if ! printf '%s\n' "$gdb_output" | grep -F 'Section .picobin,' | grep -Fq ': matched.'; then
  exit "$gdb_status"
fi
if ! printf '%s\n' "$gdb_output" | grep -F 'Section .text,' | grep -Fq ': matched.'; then
  exit "$gdb_status"
fi
# .data has VMA in RAM and LMA in flash; compare-sections checks the VMA
# where startup has not copied data yet, so MIS-MATCH is expected.
if printf '%s\n' "$gdb_output" | grep -F 'Section' | grep -Fv '.data' | grep -Eq 'MIS-MATCHED|FAILED'; then
  exit 1
fi
if test "$gdb_status" -ne 0; then
  echo "GDB connection closed after reset; flash verification succeeded."
fi
"""

[tasks.debug]
description = "Start an interactive GDB session through the CMSIS-DAP SWD probe"
depends = ["link", "setup-debugger"]
raw = true
run = """
set -eu
mkdir -p {{vars.build_dir}}
{{vars.openocd}} -s {{vars.openocd_scripts}} -f interface/cmsis-dap.cfg -c 'adapter speed 1000' -f target/rp2350-riscv.cfg > {{vars.openocd_log}} 2>&1 &
openocd_pid=$!
trap 'kill "$openocd_pid" 2>/dev/null || true; wait "$openocd_pid" 2>/dev/null || true' EXIT
sleep 1
{{vars.gdb}} {{vars.elf}} -ex 'set architecture riscv:rv32' -ex 'target remote :3333' -ex 'monitor halt' -ex 'layout src' -ex 'layout regs'
reset
"""

[tasks.console]
description = "Read UART0 logs from the Raspberry Pi Debug Probe"
raw = true
run = "stty -F {{vars.serial_device}} 115200 cs8 -cstopb -parenb -ixon -ixoff && cat {{vars.serial_device}}"

[tasks.inspect]
description = "Inspect ELF and UF2 target metadata"
depends = ["build"]
run = [
  "{{vars.readelf}} -h {{vars.elf}}",
  "{{vars.size}} --format=sysv {{vars.elf}}",
  "picotool info {{vars.uf2}}",
]

[tasks.disassemble]
description = "Write annotated RISC-V disassembly"
depends = ["link"]
sources = ["{{vars.elf}}"]
outputs = ["{{vars.disassembly}}"]
run = "{{vars.objdump}} -d -S {{vars.elf}} > {{vars.disassembly}}"

[tasks.clean]
description = "Remove generated build artifacts"
run = "rm -rf {{vars.build_dir}}"

[tasks.assets]
description = "Convert PNG textures in assets/ to RGB565 binary files for .incbin"
sources = ["assets/*.png", "tools/png2rgb565.py"]
outputs = ["{{vars.build_dir}}/assets/assets.h"]
run = """
mkdir -p {{vars.build_dir}}/assets
python3 tools/png2rgb565.py assets {{vars.build_dir}}/assets
"""
